name: llm-evals

# The model-backed half of the suite. Scheduled rather than per-push because
# it costs money per run and is sampled at temperature 0.7, so an occasional
# miss is wording, not a regression. A failure here opens an investigation;
# it does not block anyone's branch.
#
# Needs the OPENAI_API_KEY repository secret. Without it the job is skipped,
# so forks and contributors are never blocked by a missing credential.

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays, 06:00 UTC
  workflow_dispatch:

jobs:
  llm-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projeto
    # The `secrets` context is not available to a step-level `if` (the allowed
    # contexts are github, needs, strategy, matrix, job, runner, env, vars,
    # steps and inputs), so `if: ${{ secrets.X != '' }}` makes GitHub reject
    # the whole file with "Unrecognized named-value: 'secrets'" — the workflow
    # never runs at all, which is the opposite of skipping a step. Lift it into
    # job-level env and test that instead.
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: projeto/backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      # Without the secret the job would otherwise report success having run
      # nothing, which reads as a passing scheduled eval. Say so out loud.
      - name: Report a missing key
        if: env.OPENAI_API_KEY == ''
        run: |
          echo "::warning::OPENAI_API_KEY is not set; the model path was not exercised."

      - name: Eval suite (model path)
        if: env.OPENAI_API_KEY != ''
        run: npm run eval:llm
