name: checks

# Runs on every push and PR. Deliberately contains no step that calls a model:
# the LLM evals cost money and are non-deterministic, so they cannot gate a
# merge. They run on a schedule instead (see llm-evals.yml), where a red run is
# a prompt to investigate rather than a blocked branch.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projeto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: projeto/backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Sanitizer checks
        run: npm run test:sanitizer

      - name: Eval suite (rule-based path, offline)
        run: npm run eval
